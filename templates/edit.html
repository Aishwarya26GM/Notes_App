{% extends "base.html" %}
{% block content %}
<div class="card">
    <h3>Edit Note</h3>
    <form method="POST">
        <input type="text" name="title" value="{{ note.title }}" required>
        <textarea name="content" rows="6" required>{{ note.content }}</textarea>
        <button type="submit">Save</button>
        <a href="{{ url_for('notes') }}">Cancel</a>
    </form>
</div>
{% endblock %}
